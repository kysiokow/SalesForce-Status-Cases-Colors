<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 340px; padding: 15px; font-family: 'Segoe UI', sans-serif; background: #f4f6f9; }
    h2 { font-size: 16px; color: #1589ee; margin: 0 0 10px 0; border-bottom: 2px solid #1589ee; padding-bottom: 5px; }
    .item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    label { font-size: 12px; color: #3e3e3c; font-weight: 500; }
    input[type="color"] { border: none; width: 35px; height: 30px; cursor: pointer; background: none; }
    .buttons { margin-top: 15px; display: flex; gap: 8px; }
    button { flex: 1; padding: 10px; border-radius: 4px; border: 1px solid #dddbda; cursor: pointer; font-size: 11px; font-weight: bold; transition: all 0.2s; }
    #save { background: #0070d2; color: white; border: none; }
    #save:hover { background: #005fb2; }
    #reset { background: #fff; color: #706e6b; }
    #reset:hover { background: #f3f2f2; }
    .backup-section { margin-top: 15px; border-top: 1px solid #ddd; padding-top: 10px; }
    textarea { width: 100%; height: 60px; font-size: 10px; margin-top: 5px; resize: none; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    .btn-small { padding: 6px; margin-top: 5px; font-size: 10px; }
    #status-msg { font-size: 11px; text-align: center; margin-top: 10px; min-height: 15px; font-weight: bold; }
    .msg-success { color: #2e8444; }
    .msg-error { color: #ea001e; }
  </style>
</head>
<body>
  <h2>Personalizacja SF</h2>
  
  <div class="item"><label>Nagłówek tabeli</label><input type="color" id="hdr-bg"></div>
  <div class="item"><label>Wiersze tabeli</label><input type="color" id="row-bg"></div>
  <div class="item"><label>Oczekiwanie</label><input type="color" id="st-wait"></div>
  <div class="item"><label>Odpowiedź otrzym.</label><input type="color" id="st-recv"></div>
  <div class="item"><label>Otwarta ponownie</label><input type="color" id="st-reop"></div>
  <div class="item"><label>W trakcie</label><input type="color" id="st-prog"></div>
  <div class="item"><label>Zgłoszenie przyjęte</label><input type="color" id="st-acpt"></div>
  <div class="item"><label>Zakończona</label><input type="color" id="st-done"></div>
  
  <div id="status-msg"></div>

  <div class="buttons">
    <button id="reset">Przywróć domyślne</button>
    <button id="save">Zapisz i Zastosuj</button>
  </div>
  <div class="item">
  <label>Powiadomienia o godzinie</label>
  <input type="checkbox" id="enable-clock">
</div>

  <div class="backup-section">
    <label>Eksport / Import (JSON):</label>
    <textarea id="io-config" placeholder="Wklej kod tutaj, aby zaimportować..."></textarea>
    <div style="display:flex; gap:5px;">
        <button id="exportBtn" class="btn-small">Pobierz kod</button>
        <button id="importBtn" class="btn-small" style="background:#e1f5fe;">Zaimportuj kod</button>
    </div>
  </div>

  <script src="js/popup.js"></script>
</body>
</html>
